# .forgejo/workflows/deploy.yml
name: Deploy Project
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            cd /opt/examination4
            export $(grep -E '^FORGEJO_USER|^FORGEJO_TOKEN|^FORGEJO_HOST|^FORGEJO_PORT' .env | xargs)
            git fetch http://${FORGEJO_USER}:${FORGEJO_TOKEN}@${FORGEJO_HOST}:${FORGEJO_PORT}/mos/examination4.git
            git reset --hard FETCH_HEAD
            docker compose down
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            echo "Deploy done! 🐸"
