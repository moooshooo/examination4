name: Deploy Examination 4
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH till Lilypad
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Går in i projektmappen..."
            cd /opt/kurs4/examination4

            echo "Hämtar senaste koden från Forgejo..."
            git fetch origin
            git reset --hard origin/main

            echo "Bygger om och startar Docker-containrarna..."
            docker compose down
            docker compose up -d --build

            echo "Deploy färdig! 🐸"
