name: Deploy Examination 4
on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH till Lilypad
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            echo "Går in i projektmappen..."
            cd /opt/kurs4/examination4

            echo "Laddar miljövariabler..."
            export $(grep -E '^FORGEJO_USER|^FORGEJO_PASS|^FORGEJO_HOST|^FORGEJO_PORT' .env | xargs)

            echo "Hämtar senaste koden från Forgejo..."
            REPO_PATH=$(git remote get-url origin | sed 's|.*@||;s|.*://[^/]*/||')
            git remote set-url origin https://${FORGEJO_USER}:${FORGEJO_PASS}@${FORGEJO_HOST}:${FORGEJO_PORT}/${REPO_PATH}
            git fetch origin
            git reset --hard origin/main
            git remote set-url origin https://${FORGEJO_HOST}:${FORGEJO_PORT}/${REPO_PATH}

            echo "Bygger om och startar Docker-containrarna..."
            docker compose down
            docker compose up -d --build

            echo "Rensar oanvända Docker-images..."
            docker image prune -f

            echo "Verifierar att containrarna startade..."
            docker compose ps

            echo "Deploy färdig! 🐸 Riiiiibbbit"