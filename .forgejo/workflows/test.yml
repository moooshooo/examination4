# .forgejo/workflows/test.yml
name: Test
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Installera backend-beroenden
        working-directory: backend
        run: bun install

      - name: Kör enhetstester (Zod-scheman)
        working-directory: backend
        run: bun test src/tests/schema.test.ts
