# .forgejo/workflows/ci.yml
name: CI/CD

on:
  push:
  pull_request:

jobs:
  # ── Tester (körs alltid vid push/PR) ───────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Installera backend-beroenden
        working-directory: backend
        run: bun install

      - name: Kör integrationstester
        working-directory: backend
        run: bun test src/tests/flow.test.ts

  # ── Deploy (bara på main, kräver att test passerar) ───────────────────────
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SERVER_PORT }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "cd /opt/examination4 && \
               export \$(grep -E '^FORGEJO_USER|^FORGEJO_TOKEN|^FORGEJO_HOST|^FORGEJO_PORT' .env | xargs) && \
               git fetch http://\${FORGEJO_USER}:\${FORGEJO_TOKEN}@\${FORGEJO_HOST}:\${FORGEJO_PORT}/mos/examination4.git && \
               git reset --hard FETCH_HEAD && \
               docker compose down && \
               docker compose up -d --build && \
               docker image prune -f && \
               docker compose ps && \
               echo 'Deploy done! 🐸'"
