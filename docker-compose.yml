# docker-compose.yml
services:

  # ── Infrastruktur (inga externa portar) ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toads-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toads-network

  # ── App-tjänster (interna, inga externa portar) ───────────────────────────
  product-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: product-service
    environment:
      SERVICE: product-service
      PORT: "3001"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    environment:
      SERVICE: order-service
      PORT: "3002"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

  kitchen-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: kitchen-service
    environment:
      SERVICE: kitchen-service
      PORT: "3003"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    environment:
      SERVICE: notification-service
      PORT: "3004"
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      SERVICE: gateway
      PORT: "3000"
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - toads-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - gateway
    networks:
      - toads-network

  # ── Publik ingång ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8015}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - frontend
    networks:
      - toads-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  toads-network:
    driver: bridge
