# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5415}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toads-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5615}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15615}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toads-network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6315}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - toads-network

  product-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: product-service
    environment:
      SERVICE: product-service
      PORT: "3001"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    environment:
      SERVICE: order-service
      PORT: "3002"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

  kitchen-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: kitchen-service
    environment:
      SERVICE: kitchen-service
      PORT: "3003"
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    environment:
      SERVICE: notification-service
      PORT: "3004"
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - toads-network

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  toads-network:
    driver: bridge
